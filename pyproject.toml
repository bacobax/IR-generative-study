[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-matching-trial"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=10,<12",
    "uvicorn[standard]>=0.32,<1",
]
yolo = [
    "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["src*"]
