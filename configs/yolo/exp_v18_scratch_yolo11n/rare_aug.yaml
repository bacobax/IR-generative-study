extends: _base.yaml

# Global Ultralytics augmentation is OFF so no standard mosaic/hsv/fliplr
# aug fires.  Instead, targeted geometric augmentation is applied ONLY to
# images whose bounding-box slices are rare (baseline_b mode).
# Oversampling is disabled (use_weighted_sampler: false), so sampling stays
# uniform — images are not repeated more often, they just get harder aug when
# they are selected.
experiment_b:
  disable_ultralytics_augmentations: true

baseline:
  mode: baseline_b
  use_weighted_sampler: false   # targeted aug only; no weighted oversampling
  rarity_alpha: 1.0
  image_score_top_k: 3
  targeted_aug_probability: 0.8
  targeted_aug_rarity_quantile: 0.7
  translate_fraction: 0.05
  scale_min: 0.85
  scale_max: 1.15
  crop_scale_min: 0.80
  crop_scale_max: 1.0
  crop_min_rare_box_area_retained: 0.5
  crop_max_attempts: 10
  allow_horizontal_flip: true

output:
  experiment_name: rare_aug
