# Base config for v4 native simple_torch YOLO experiments.
# Inherits v3 architecture (base_channels=32, width_multiplier=1.0) + speed optimisations:
#   - cache_images: true  (decode each image once into RAM)
#   - workers: 8          (more prefetch workers; persistent across epochs)
#   - val_interval: 5     (eval every 5 epochs, not every epoch)
#
# Augmentation is OFF by default — override in variant configs.

data:
  dataset_yaml: data/derived/yolo-test-ds_v18/full_train.yaml
  test_dataset_yaml: data/derived/yolo-test-ds_v18/test.yaml
  batch_size: 16
  workers: 8
  image_size: 256
  cache_images: true

model:
  backend: simple_torch
  weights: ""
  task: detect
  simple:
    input_channels: 3
    base_channels: 32
    width_multiplier: 1.0
    channel_multipliers: [1, 2, 4, 8]
    blocks_per_stage: [1, 1, 1, 1]
    output_stride: 16
    boxes_per_cell: 2
    activation: silu
    dropout: 0.0

training:
  epochs: 75
  lr0: 0.001
  optimizer: AdamW
  momentum: 0.937
  weight_decay: 0.0005
  seed: 7
  deterministic: true
  patience: 20
  cos_lr: true
  mixed_precision: auto
  grad_clip_norm: 10.0
  val_interval: 5
  tensorboard_image_interval: 5
  tensorboard_max_images: 4
  tensorboard_prediction_conf: 0.25

loss:
  box_weight: 5.0
  giou_weight: 2.0
  objectness_weight: 1.0
  no_object_weight: 2.0
  class_weight: 1.0

augment:
  enabled: false

baseline:
  mode: none

evaluation:
  dataset_yaml: data/derived/yolo-test-ds_v18/test.yaml
  split: test
  save_json: true
  save_hybrid: false
  conf: 0.25
  iou: 0.5
  per_slice_enabled: true
  slice_threshold_dataset_yaml: data/derived/yolo-test-ds_v18/full_train.yaml

output:
  runs_root: artifacts/runs/yolo/exp_v18_simple_yolo_tiny
  checkpoints_root: artifacts/checkpoints/yolo/exp_v18_simple_yolo_tiny
  analysis_root: artifacts/analysis/yolo/exp_v18_simple_yolo_tiny
