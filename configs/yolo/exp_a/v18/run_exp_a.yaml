data:
  balanced_dataset_yaml: data/derived/yolo-test-ds_v18/balanced.yaml
  unbalanced_dataset_yaml: data/derived/yolo-test-ds_v18/unbalanced.yaml
  full_train_dataset_yaml: data/derived/yolo-test-ds_v18/full_train.yaml
  test_dataset_yaml: data/derived/yolo-test-ds_v18/test.yaml
  batch_size: 16
  workers: 4
  image_size: 640

model:
  weights: yolov8n.pt
  task: detect

training:
  epochs: 50
  lr0: 0.01
  optimizer: SGD
  momentum: 0.937
  weight_decay: 0.0005
  seed: 7
  deterministic: true
  patience: 20
  cos_lr: false
  freeze_backbone_epochs: 5
  freeze_backbone_layers: 10
  backbone_lr_multiplier: 0.1
  backbone_param_prefixes:
    - model.0.
    - model.1.
    - model.2.
    - model.3.
    - model.4.
    - model.5.
    - model.6.
    - model.7.
    - model.8.
    - model.9.

evaluation:
  split: test
  save_json: true

output:
  runs_root: artifacts/runs/yolo/exp_a/v18
  checkpoints_root: artifacts/checkpoints/yolo/exp_a/v18
  analysis_root: artifacts/analysis/yolo/exp_a/v18

launcher:
  balanced_experiment_name: exp_balanced
  unbalanced_experiment_name: exp_unbalanced
  full_train_experiment_name: exp_full_train
  comparison_filename: comparison_summary.csv
