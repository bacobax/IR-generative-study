    - configs/yolo/exp_a/flir_yolov8m/exp_balanced.yaml
    - configs/yolo/exp_a/flir_yolov8m/exp_unbalanced.yaml
    - configs/yolo/exp_a/flir_yolov8m/exp_full_train.yaml
    - configs/yolo/exp_a/flir_yolov8m/exp_full_train_baseline_a.yaml
