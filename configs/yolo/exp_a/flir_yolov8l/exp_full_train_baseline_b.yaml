data:
  dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  test_dataset_yaml: data/derived/yolo-test-ds/test.yaml
  batch_size: 4
  workers: 4
  image_size: 640

model:
  weights: yolov8l.pt
  task: detect

training:
  epochs: 100
  lr0: 0.01
  optimizer: SGD
  momentum: 0.937
  weight_decay: 0.0005
  seed: 7
  deterministic: true
  patience: 20
  cos_lr: false
  freeze_backbone_epochs: 5
  freeze_backbone_layers: 10
  backbone_lr_multiplier: 0.1
  backbone_param_prefixes:
    - model.0.
    - model.1.
    - model.2.
    - model.3.
    - model.4.
    - model.5.
    - model.6.
    - model.7.
    - model.8.
    - model.9.

baseline:
  mode: baseline_b
  rarity_alpha: 1.0
  rarity_eps: 1.0e-6
  image_score_top_k: 3
  normalize_weights: true
  clip_weight_max: 10.0
  sampler_replacement: true
  targeted_aug_probability: 0.5
  targeted_aug_rarity_quantile: 0.8
  translate_fraction: 0.05
  scale_min: 0.9
  scale_max: 1.1
  crop_scale_min: 0.85
  crop_scale_max: 1.0
  crop_min_rare_box_area_retained: 0.5
  crop_max_attempts: 10
  allow_horizontal_flip: true
  seed: 7

evaluation:
  split: test
  save_json: true
  save_hybrid: false

output:
  experiment_name: exp_full_train_baseline_b_yolov8l
  runs_root: artifacts/runs/yolo/exp_a/flir_yolov8l
  checkpoints_root: artifacts/checkpoints/yolo/exp_a/flir_yolov8l
  analysis_root: artifacts/analysis/yolo/exp_a/flir_yolov8l
