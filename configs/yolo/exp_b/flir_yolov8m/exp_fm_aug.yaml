data:
  dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  full_train_dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  test_dataset_yaml: data/derived/yolo-test-ds/test.yaml
  batch_size: 16
  workers: 4
  image_size: 640

model:
  weights: yolov8m.pt
  task: detect

training:
  epochs: 100
  lr0: 0.01
  optimizer: SGD
  momentum: 0.937
  weight_decay: 0.0005
  seed: 7
  deterministic: true
  patience: 20
  cos_lr: false
  freeze_backbone_epochs: 5
  freeze_backbone_layers: 10
  backbone_lr_multiplier: 0.1
  backbone_param_prefixes:
    - model.0.
    - model.1.
    - model.2.
    - model.3.
    - model.4.
    - model.5.
    - model.6.
    - model.7.
    - model.8.
    - model.9.

evaluation:
  dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  split: val
  save_json: true
  save_hybrid: false

experiment_b:
  mode: fm_aug
  invalid_instance_ratio_threshold: 0.6
  generated_dataset_dir: artifacts/generated/yolo/exp_b/flir_yolov8m/generated_candidates
  augmented_yolo_root: artifacts/generated/yolo/exp_b/flir_yolov8m/augmented_yolo
  disable_ultralytics_augmentations: false
  filter:
    checkpoint_dir: artifacts/checkpoints/multiclass_foreground_background_filter/runs/multiclass_fgbg_20260415_210440/checkpoints
    batch_size: 64
  fm:
    checkpoint_path: artifacts/checkpoints/flow_matching/serious_runs/stay_layout_latent_flir_sd15_512/UNET/unet_fm_epoch_270.pt
    preset_path: configs/fm/train/presets/stay_layout_latent_flir_sd15_512.yaml
    steps: 20
    batch_size: 8

output:
  experiment_name: exp_fm_aug
  runs_root: artifacts/runs/yolo/exp_b/flir_yolov8m
  checkpoints_root: artifacts/checkpoints/yolo/exp_b/flir_yolov8m
  analysis_root: artifacts/analysis/yolo/exp_b/flir_yolov8m
