data:
  dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  full_train_dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  test_dataset_yaml: data/derived/yolo-test-ds/test.yaml
  batch_size: 16
  workers: 4
  image_size: 640

model:
  weights: yolov8n.pt
  task: detect

training:
  epochs: 100
  lr0: 0.01
  optimizer: SGD
  momentum: 0.937
  weight_decay: 0.0005
  seed: 7
  deterministic: true
  patience: 20
  cos_lr: false
  freeze_backbone_epochs: 5
  freeze_backbone_layers: 10
  backbone_lr_multiplier: 0.1
  backbone_param_prefixes:
    - model.0.
    - model.1.
    - model.2.
    - model.3.
    - model.4.
    - model.5.
    - model.6.
    - model.7.
    - model.8.
    - model.9.

evaluation:
  dataset_yaml: data/derived/yolo-test-ds/full_train.yaml
  split: val
  save_json: true
  save_hybrid: false

experiment_b:
  mode: sd_aug
  invalid_instance_ratio_threshold: 0.5
  generated_dataset_dir: artifacts/generated/yolo/exp_b/flir_yolov8n/generated_candidates
  augmented_yolo_root: artifacts/generated/yolo/exp_b/flir_yolov8n/augmented_yolo
  disable_ultralytics_augmentations: true
  filter:
    checkpoint_dir: artifacts/checkpoints/multiclass_foreground_background_filter/runs/multiclass_fgbg_20260415_210440/checkpoints
    batch_size: 64
  sd:
    stage1_dir: artifacts/checkpoints/stable_diffusion/unet_runs/flir_sd15_unet_full_stage1
    base_model: runwayml/stable-diffusion-v1-5
    sd_steps: 100
    guidance: 7.5
    precision: fp16
    max_tries: 25
    prompt_mode: constant

output:
  experiment_name: exp_sd_aug_unet
  runs_root: artifacts/runs/yolo/exp_b/flir_yolov8n
  checkpoints_root: artifacts/checkpoints/yolo/exp_b/flir_yolov8n
  analysis_root: artifacts/analysis/yolo/exp_b/flir_yolov8n
