# Meta FM full curriculum training preset

data:
  train_dir: "./data/raw/v18/train/"
  annotations_path: "data/raw/v18/train/annotations.json"
  fallback_text: ""
  batch_size: 8
  num_workers: 4

model:
  unet_config: "configs/models/fm/text_unet_config.json"
  vae_config: "configs/models/fm/vae_config.json"
  vae_weights: "./artifacts/checkpoints/vae/vae_runs/vae_fm_x4/VAE/vae_best.pt"
  model_builder_name: "text_moe_unet"

conditioning:
  text_encoder: "openai/clip-vit-large-patch14"
  max_text_length: 77
  cond_drop_prob: 0.05
  return_pooled: true

curriculum:
  enabled: true
  crop_prob_start: 0.5
  crop_prob_end: 0.1
  schedule: "linear"
  margin_min: 1.2
  margin_max: 2.0
  center_jitter: 0.15
  force_square: false

augment:
  warmup_frac: 0.1
  ramp_frac: 0.3
  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.05
  p_rot_max: 0.30
  p_rot_final: 0.05

training:
  t_scale: 1000.0
  train_target: "v"

phase_a:
  epochs: 400
  lr: 8.0e-5
  lambda_corr: 0.05
  mlp_trainable: true
  router_trainable: true
  moe_trainable: true
  unet_trainable: true
  unfreeze_unet_policy: "all"

phase_b:
  epochs: 0
  lr: 5.0e-5
  lambda_corr: 1.0
  mlp_trainable: true
  router_trainable: true
  moe_trainable: false
  unet_trainable: false
  unfreeze_unet_policy: "none"

phase_c:
  epochs: 0
  lr: 1.0e-4
  replay_every: 1
  lambda_corr: 1.0
  mlp_trainable: true
  router_trainable: true
  moe_trainable: true
  unet_trainable: false
  unfreeze_unet_policy: "none"
  router_lr_scale: 0.25

condition_split:
  base: [1, 2, 3, 4, 7, 8, 9]
  incremental: []
  test: [5, 6]

count_filter:
  max_crop_retries: 5

router_reg:
  sparsity_weight: 0.0
  smoothness_weight: 1.0e-4
  balance_weight: 0.0

sampling:
  enabled: true
  phase_a_every: 50
  steps: 100
  guidance_scale: 7.5
  samples_per_condition: 3
  output_dir: "./artifacts/generated/meta_fm_only_phase_a/sanity_samples"

evaluation:
  enabled: true
  samples_per_condition: 50
  steps: 100
  guidance_scale: 7.5
  output_dir: "./artifacts/generated/meta_fm_only_phase_a/test_conditions"

output:
  model_dir: "./artifacts/checkpoints/flow_matching/meta_fm_only_phase_a/"
  log_dir: "./artifacts/runs/main/flow_matching/meta_fm_only_phase_a/"
  resume: null

checkpoint:
  enabled: true
  save_every_epochs: 1
  save_latest: true
  latest_filename: "meta_fm_latest.pt"
  dir_name: "meta_checkpoints"

trainer_name: "meta_fm"

device: "cuda:3"                   # auto-detect, or "cuda:0", "cuda:1", etc.
