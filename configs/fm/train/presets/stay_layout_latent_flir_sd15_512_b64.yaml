# STAY-style latent FM on FLIR using the Stable Diffusion 1.5 VAE.
# The single-channel IR input is replicated to RGB before SD-VAE encoding.
# Horizontal flip augmentation follows the matched hflip schedule.
# Launcher: slurm/killarney/train_stay_layout_fm_hflip_kl.slurm

data:
  dataset_id: "flir_private_proxy_alignment_v18"
  image_size: 512
  batch_size: 32
  num_workers: 2

model:
  unet_config: "configs/models/fm/stable_unet_x4_512.json"
  vae_config: null
  vae_weights: null
  vae_pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_pretrained_subfolder: "vae"
  pretrained_unet_path: null

augment:
  warmup_frac: 0.10
  ramp_frac: 0.30

  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.0
  p_rot_max: 0.0
  p_rot_final: 0.0

  p_hflip_warmup: 0.0
  p_hflip_max: 0.6
  p_hflip_final: 0.3

training:
  epochs: 400
  lr: 0.0001
  t_scale: 1000.0
  train_target: "v"
  save_every_n_epochs: 30
  eval_every: 3
  patience: null
  min_delta: 0.0
  strict_load: true
  max_grad_norm: 1.0

optimizer:
  name: "adamw"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999

scheduler:
  name: "warmup_cosine"
  warmup_ratio: 0.05
  min_lr_ratio: 0.1

ema:
  enabled: true
  decay: 0.999
  start_step: 100

precision:
  mixed_precision: "auto"

path:
  mode: "conditional_ot"
  solver: "hungarian"
  layout_cost_resolution: 32
  condition_weight: 1.0

layout_conditioning:
  enabled: true
  variant: "stay_v2"
  class_embed_dim: 48
  bbox_embed_dim: 48
  object_embed_dim: 64
  use_style_latent: true
  style_latent_dim: 16
  style_seed: 1234
  mask_resolution: 16
  mask_hidden_channels: 32
  mask_threshold: 0.5
  edge_dilation: 1
  injection_mode: "ea_norm"
  use_masked_context: true
  mask_overlap_loss_weight: 0.05
  mask_sharpness_loss_weight: 0.01
  mask_activation_loss_weight: 0.01
  log_internal_maps: false

logging:
  scalar_every_steps: 50
  max_logged_images: 8

sampling:
  sample_every: 10
  sample_steps: 40
  sample_batch_size: 4
  sample_shape: null
  fixed_validation_examples: 4
  save_debug_images: true

output:
  model_dir: "./artifacts/checkpoints/flow_matching/serious_runs/stay_layout_latent_flir_sd15_512_hflip"
  log_dir: "./artifacts/runs/main/flow_matching/stay_layout_latent_flir_sd15_512_hflip"
  debug_dir: "./artifacts/debug/stay_layout_latent_flir_sd15_512_hflip"
  resume: null

trainer_name: "layout_fm"
device: null
