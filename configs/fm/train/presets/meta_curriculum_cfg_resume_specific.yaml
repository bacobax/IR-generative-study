# Resume from one specific full-state curriculum checkpoint file.

data:
  train_dir: "./data/raw/v18/train/"
  annotations_path: "data/raw/v18/train/annotations.json"
  batch_size: 16
  num_workers: 4

model:
  unet_config: "configs/models/fm/text_unet_config.json"
  vae_config: "configs/models/fm/vae_config.json"
  vae_weights: "./artifacts/checkpoints/vae/vae_runs/vae_fm_x4/VAE/vae_best.pt"
  model_builder_name: "text_moe_unet"

conditioning:
  text_encoder: "openai/clip-vit-large-patch14"
  max_text_length: 77
  cond_drop_prob: 0.05
  return_pooled: true

training:
  t_scale: 1000.0
  train_target: "v"

phase_a:
  epochs: 400
  lr: 8.0e-5
  mlp_trainable: true
  router_trainable: true
  moe_trainable: true
  unet_trainable: true
  unfreeze_unet_policy: "all"

phase_b:
  epochs: 92
  lr: 5.0e-5
  mlp_trainable: false
  router_trainable: true
  moe_trainable: false
  unet_trainable: false
  unfreeze_unet_policy: "none"

phase_c:
  epochs: 154
  lr: 1.0e-4
  replay_every: 1
  mlp_trainable: true
  router_trainable: false
  moe_trainable: true
  unet_trainable: true
  unfreeze_unet_policy: "up"
  router_lr_scale: 1.0

condition_split:
  base: [1, 2, 3, 4, 8, 9]
  incremental: [7]
  test: [5, 6]

output:
  model_dir: "./artifacts/checkpoints/flow_matching/meta_fm_balanced/"
  log_dir: "./artifacts/runs/main/flow_matching/meta_fm_balanced/"
  resume: "./artifacts/checkpoints/flow_matching/meta_fm_balanced/meta_checkpoints/meta_fm_phase_c_cond_7_epoch_0042.pt"

checkpoint:
  enabled: true
  save_every_epochs: 1
  save_latest: true
  latest_filename: "meta_fm_latest.pt"
  dir_name: "meta_checkpoints"

trainer_name: "meta_fm"
