# Latent FM with opt-in RegionDiff layout conditioning.

data:
  dataset_id: flir_private_proxy_alignment_v18
  image_size: 256
  batch_size: 2
  num_workers: 0
  max_train_samples: 8
  max_val_samples: 4
  subset_manifest: null

model:
  unet_config: "configs/models/fm/stable_unet_config.json"
  vae_config: "configs/models/fm/vae_config.json"
  vae_weights: "./artifacts/checkpoints/vae/vae_runs/vae_fm_x4/VAE/vae_best.pt"

layout_conditioning:
  enabled: true
  variant: regiondiff_v1
  active_region_resolutions: [64, 32, 16]
  layout_token_dim: 128
  bbox_fourier_dim: 32
  same_class_position_slots: 64
  use_background_token: true
  train_mode: adapters_only
  adapter_learning_rate: 1.0e-4
  backbone_learning_rate: 1.0e-5

training:
  epochs: 1
  lr: 1.0e-4
  t_scale: 1000.0
  train_target: v
  save_every_n_epochs: 1
  eval_every: 1

sampling:
  sample_every: 0

output:
  model_dir: "./artifacts/checkpoints/flow_matching/regiondiff_latent_smoke"

trainer_name: default_fm
