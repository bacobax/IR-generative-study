# Unconditional latent Flow Matching on FLIR using the Stable Diffusion 1.5 VAE.
# The single-channel IR input is replicated to RGB before SD-VAE encoding.
# Launcher: bash scripts/train/uncond_fm_latent_flir_sd15_512.sh

data:
  dataset_id: "flir_private_proxy_alignment_v18"
  image_size: 512
  batch_size: 32
  num_workers: 4
  subset_manifest: null

model:
  unet_config: "configs/models/fm/stable_unet_x4_512.json"
  vae_config: null
  vae_weights: null
  vae_pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_pretrained_subfolder: "vae"
  pretrained_unet_path: null

augment:
  warmup_frac: 0.0
  ramp_frac: 0.0
  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.0
  p_rot_max: 0.0
  p_rot_final: 0.0

training:
  epochs: 300
  lr: 0.0001
  gradient_accumulation_steps: 1
  t_scale: 1000.0
  train_target: "v"
  save_every_n_epochs: 30
  eval_every: 3
  patience: null
  min_delta: 0.0
  strict_load: true
  max_grad_norm: 1.0

optimizer:
  name: "adamw"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999

scheduler:
  name: "warmup_cosine"
  warmup_ratio: 0.05
  min_lr_ratio: 0.1

ema:
  enabled: true
  decay: 0.999
  start_step: 100

precision:
  mixed_precision: "auto"

sampling:
  sample_every: 10
  sample_steps: 40
  sample_batch_size: 4
  sample_shape: null
  fixed_validation_examples: 4
  save_debug_images: true

output:
  model_dir: "./artifacts/checkpoints/flow_matching/serious_runs/uncond_latent_flir_sd15_512"
  log_dir: "./artifacts/runs/main/flow_matching/uncond_latent_flir_sd15_512"
  debug_dir: "./artifacts/debug/uncond_latent_flir_sd15_512"
  resume: null

device: cuda:0
