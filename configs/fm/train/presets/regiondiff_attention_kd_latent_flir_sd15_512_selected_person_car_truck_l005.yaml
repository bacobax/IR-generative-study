# RegionDiff attention-map KD for scratch latent FM on FLIR.
# Selected categories only: person, car, truck. lambda_attn=0.05.

data:
  dataset_id: "flir_private_proxy_alignment_v18"
  image_size: 512
  batch_size: 32
  num_workers: 4

model:
  unet_config: "configs/models/fm/stable_unet_x4_512.json"
  vae_config: null
  vae_weights: null
  vae_pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_pretrained_subfolder: "vae"
  pretrained_unet_path: "./artifacts/checkpoints/flow_matching/serious_runs/uncond_latent_flir_sd15_512_hflip_ot/UNET/unet_fm_epoch_300.pt"

augment:
  warmup_frac: 0.10
  ramp_frac: 0.30
  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.0
  p_rot_max: 0.0
  p_rot_final: 0.0
  p_hflip_warmup: 0.0
  p_hflip_max: 0.6
  p_hflip_final: 0.3

layout_conditioning:
  enabled: true
  variant: "regiondiff_v1"
  active_region_resolutions: [64, 32, 16]
  layout_token_dim: 256
  bbox_fourier_dim: 64
  same_class_position_slots: 128
  use_background_token: true
  train_mode: "adapters_plus_partial_backbone"
  partial_backbone_modules: [mid_block, up_blocks]
  adapter_learning_rate: 1.0e-4
  backbone_learning_rate: 1.0e-5
  area_loss_enabled: true
  area_loss_alpha: 1.0
  area_loss_background_weight: 0.5
  area_loss_min_weight: 0.5
  area_loss_max_weight: 4.0

distillation:
  enabled: true
  teacher_checkpoint: "artifacts/checkpoints/stable_diffusion/layout_runs/flir_sd15_regiondiff_stage2_from_lora_r8_fm_comparable"
  teacher_model_type: "sd15_regiondiff"
  loss_type: "attention_kl"
  lambda_attn: 0.05
  warmup_epochs: 80
  selected_categories: ["person", "car", "truck"]
  selected_region_layers: []
  timestep_range: [0.2, 0.8]
  detach_teacher: true
  normalize_attention: true
  bbox_mask_only: true
  log_attention_maps_every: 1000

training:
  epochs: 200
  lr: 1.0e-4
  t_scale: 1000.0
  train_target: "v"
  save_every_n_epochs: 25
  eval_every: 2
  patience: null
  min_delta: 0.0
  strict_load: true
  max_grad_norm: 1.0

optimizer:
  name: "adamw"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999

scheduler:
  name: "constant_with_warmup"
  warmup_ratio: 0.05
  min_lr_ratio: 1.0

ema:
  enabled: true
  decay: 0.999
  start_step: 100

path:
  mode: "minibatch_ot"
  solver: "hungarian"
  layout_cost_resolution: 32
  condition_weight: 1.0

precision:
  mixed_precision: "auto"

sampling:
  sample_every: 50
  sample_steps: 40
  sample_batch_size: 2
  sample_shape: null
  fixed_validation_examples: 2
  save_debug_images: false

output:
  model_dir: "./artifacts/checkpoints/flow_matching/serious_runs/regiondiff_attention_kd_latent_flir_sd15_512_selected_person_car_truck_l005"
  log_dir: "./artifacts/runs/main/flow_matching/regiondiff_attention_kd_latent_flir_sd15_512_selected_person_car_truck_l005"
  debug_dir: "./artifacts/debug/regiondiff_attention_kd_latent_flir_sd15_512_selected_person_car_truck_l005"
  resume: "artifacts/checkpoints/flow_matching/serious_runs/regiondiff_attention_kd_latent_flir_sd15_512_selected_person_car_truck_l005/UNET/unet_fm_epoch_125_ckpt.pt"

trainer_name: "default_fm"
device: null
