# Standalone post-training checkpoint selection for the FLIR unconditional FM OT run.
#
# Important for this sparse artifact:
# - The run folder has no local VAE/config.json.
# - The sampling_config_path below is required so the evaluator resolves the
#   SD1.5 VAE from the training preset instead of inventing a local VAE config.
# - With image_size=512 and the SD1.5 VAE downsample factor 8, the latent
#   sample shape resolves to 4x64x64 even though the JSON UNet template says 128.
runs:
  # - run_identifier: "uncond_fm_hflip_ot_full"
  #   run_dir: "./artifacts/checkpoints/flow_matching/serious_runs/uncond_latent_flir_sd15_512_hflip_ot"
  #   model_type: "latent_flow_matching"
  #   sampler_name: null
  #   sampling_config_path: "configs/fm/train/presets/uncond_latent_flir_sd15_512_b64_hflip_ot.yaml"
  #   generation_entrypoint: null

  - run_identifier: "flir_sd15_lora_stage1_r8"
    run_dir: "artifacts/checkpoints/stable_diffusion/lora_runs/flir_sd15_lora_stage1_r8"
    model_type: "sd_lora"
    sampler_name: null
    sampling_config_path: "configs/sd/train/presets/flir_lora_stage1_r8.yaml"
    generation_entrypoint: null

checkpoint_min_epoch: 50
checkpoint_min_step: null

stage1_num_images: 20
stage2_extra_images: 50
stage3_extra_images: 50
top_k_checkpoints: 3

kid_weight: 0.8
fid_weight: 0.2
selection_primary_metric: "KID"
selection_score_mode: "weighted_normalized_kid_fid"

dataset_id: "flir_private_proxy_alignment_v18"
real_reference_split: "val"
real_reference_num_samples: null
real_reference_path: null

metric_feature_extractor: "inception"
metric_batch_size: 8
compute_kid: true
compute_fid: true
compute_mmd: true
compute_intra_lpips: true

kid:
  subsets: 10
  subset_size: 60

mmd:
  kernel: "rbf"
  bandwidths: [0.1, 1.0, 10.0]

lpips_metric_type: "intra_lpips"
lpips_backbone: "alex"
lpips_batch_size: 8
lpips_reference_split: "train"
lpips_reference_num_samples: 1000
lpips_resize_to: 256

generation_batch_size: 1
generation_seed: 1234
stage1_seed_offset: 0
stage2_seed_offset: 100000
stage3_seed_offset: 200000

num_inference_steps: 40
mixed_precision: "auto"
device: null

output_root: "/projets/Fbassignana/diffusers_try/flow_matching_trial/artifacts/generated/checkpoint_selection"
analysis_output_root: "/projets/Fbassignana/diffusers_try/flow_matching_trial/artifacts/analysis/checkpoint_selection"
save_analysis_previews: true
analysis_preview_num_images: 16
analysis_preview_columns: 4
analysis_preview_tile_size: 128
save_generated_format: "npy"
overwrite_existing_generations: false
overwrite_existing_metrics: false
