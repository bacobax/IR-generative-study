checkpoint_min_epoch: 50
checkpoint_min_step: null

stage1_num_images: 200
stage2_extra_images: 800
stage3_extra_images: 1000
top_k_checkpoints: 3

kid_weight: 0.8
fid_weight: 0.2
selection_primary_metric: "KID"
selection_score_mode: "weighted_normalized_kid_fid"

dataset_id: "bigearthnet_s2_b08_5x5_stride3"
real_reference_split: "val"
real_reference_num_samples: null
real_reference_path: null

metric_feature_extractor: "inception"
metric_batch_size: 8
compute_kid: true
compute_fid: true
compute_mmd: true
compute_intra_lpips: false

kid:
  subsets: 100
  subset_size: 1000

mmd:
  kernel: "rbf"
  bandwidths: [0.1, 1.0, 10.0]

