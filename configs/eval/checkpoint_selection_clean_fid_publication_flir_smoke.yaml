# Publication-style checkpoint selection for completed FLIR first-stage runs.
#
# Run legacy staged selection with:
#   python scripts/select_best_checkpoint_and_compute_metrics.py \
#     --config configs/eval/checkpoint_selection_first_stage_flir_ds_trainings.yaml
#
# Run this publication pipeline with:
#   python scripts/select_best_checkpoint_and_compute_metrics.py \
#     --config configs/eval/checkpoint_selection_clean_fid_publication_flir.yaml
#
# Selection generates 10,000 images for every candidate checkpoint and ranks by
# clean_fid when the clean-fid package is installed. If clean-fid is unavailable,
# the pipeline reports and selects by inception_fid_fallback instead; it does
# not silently write fallback values under the clean_fid metric name.
#
# Final reporting reuses the selected checkpoint's 10,000 selection images,
# generates 20,000 more final_extra images, writes a manifest for the 30,000
# image set, and computes metrics against train, val, test, and train_val_test.
pipeline_mode: clean_fid_selection_publication

runs:
  - run_identifier: "uncond_latent_flir_sd15_512_hflip_ot_5000"
    run_dir: "artifacts/checkpoints/flow_matching/serious_runs/uncond_latent_flir_sd15_512_hflip_ot_train_5000"
    model_type: "latent_flow_matching"
    sampler_name: null
    sampling_config_path: "configs/datasets/flir/flow_matching/uncond_latent_flir_sd15_512_b64_hflip_ot_train_5000.yaml"
    generation_entrypoint: null

  - run_identifier: "uncond_latent_flir_sd15_512_hflip_5000"
    run_dir: "artifacts/checkpoints/stable_diffusion/uncond_runs/uncond_latent_flir_sd15_512_hflip_train_5000"
    model_type: "sd_uncond"
    sampler_name: null
    sampling_config_path: "configs/datasets/flir/diffusion/uncond_latent_flir_sd15_512_b64_hflip_train_5000.yaml"
    generation_entrypoint: null

  - run_identifier: "flir_sd15_lora_stage1_r8_train_5000"
    run_dir: "artifacts/checkpoints/stable_diffusion/lora_runs/flir_sd15_lora_stage1_r8_train_5000"
    model_type: "sd_lora"
    sampler_name: null
    sampling_config_path: "configs/datasets/flir/sd_adaptation/flir_lora_stage1_r8_train_5000.yaml"
    generation_entrypoint: null

checkpoint_min_epoch: 50
checkpoint_min_step: null

selection:
  selection_metric: clean_fid
  selection_num_images: 10
  selection_reference_source: val
  lower_is_better: true

final:
  final_extra_images: 20
  reuse_selection_images_for_top1: true
  final_total_images: 30
  real_reference_sources:
    - train
    - val
    - test
    - train_val_test

metrics:
  compute_clean_fid: true
  compute_fd_dinov2: false
  compute_kid: true
  compute_mmd: true
  compute_intra_lpips: false

feature_extractors:
  clean_fid:
    name: inception
    implementation: clean_fid
  dinov2:
    enabled: false
    model_name: facebook/dinov2-base
    feature_layer: cls
    channel_handling: replicate_grayscale_to_rgb

kid:
  subsets: 2
  subset_size: 10

mmd:
  kernel: rbf
  bandwidths: [0.1, 1.0, 10.0]

generation:
  generation_seed: 1234
  selection_seed_offset: 0
  final_extra_seed_offset: 1000000
  num_inference_steps: 50
  generation_batch_size: 8
  device: cuda
  mixed_precision: fp16
  overwrite_existing_generations: false
  overwrite_existing_metrics: false

reference_data:
  dataset_id: flir_private_proxy_alignment_v18
  real_reference_splits:
    train: train
    val: val
    test: test
  real_reference_num_samples:
    train: null
    val: null
    test: null
    train_val_test: null

output:
  output_root: "/scratch/bacobax2/smoke_stage1_checkpoint_selection_publication"
  analysis_output_root: null
  save_analysis_previews: true
  analysis_preview_num_images: 16
  analysis_preview_columns: 4
  analysis_preview_tile_size: 512

save_generated_format: npy
generated_min_std: 1.0
