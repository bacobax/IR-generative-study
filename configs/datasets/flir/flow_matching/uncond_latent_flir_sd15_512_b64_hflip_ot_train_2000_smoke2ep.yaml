# Two-epoch checkpoint smoke run for unconditional latent Flow Matching OT.
extends: fm_scratch_flir_uncond_2k.yaml

data:
  batch_size: 8

training:
  epochs: 2
  gradient_accumulation_steps: 1
  save_every_n_epochs: 1
  eval_every: 1

sampling:
  sample_every: 1

output:
  model_dir: "./artifacts/checkpoints/flow_matching/smoke_runs/fm_scratch_flir_uncond_2k_smoke2ep"
  log_dir: "./artifacts/runs/test/flow_matching/fm_scratch_flir_uncond_2k_smoke2ep"
  debug_dir: "./artifacts/debug/fm_scratch_flir_uncond_2k_smoke2ep"
