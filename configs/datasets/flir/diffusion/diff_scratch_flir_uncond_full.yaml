# Unconditional latent Stable Diffusion on FLIR using the Stable Diffusion 1.5 VAE.
# The single-channel IR input is replicated to RGB before SD-VAE encoding.
# Horizontal flip augmentation is enabled with a constant 50% probability.

data:
  dataset_id: "flir_private_proxy_alignment_v18"
  image_size: 512
  batch_size: 64
  num_workers: 4
  subset_manifest: null

model:
  unet_config: "configs/models/fm/stable_unet_x4_512.json"
  vae_config: null
  vae_weights: null
  vae_pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_pretrained_subfolder: "vae"
  pretrained_unet_path: null

augment:
  warmup_frac: 0.10
  ramp_frac: 0.30
  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.0
  p_rot_max: 0.0
  p_rot_final: 0.0
  p_hflip_warmup: 0.0
  p_hflip_max: 0.6
  p_hflip_final: 0.3

training:
  epochs: 300
  lr: 0.0001
  gradient_accumulation_steps: 1
  save_every_n_epochs: 50
  eval_every: 3
  patience: null
  min_delta: 0.0
  strict_load: true
  max_grad_norm: 1.0

optimizer:
  name: "adamw"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999

scheduler:
  name: "warmup_cosine"
  warmup_ratio: 0.05
  min_lr_ratio: 0.1

ema:
  enabled: true
  decay: 0.999
  start_step: 100

precision:
  mixed_precision: "auto"

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "scaled_linear"
  beta_start: 0.00085
  beta_end: 0.012
  prediction_type: "epsilon"
  noise_offset: 0.0
  snr_gamma: null

sampling:
  sample_every: 50
  sample_steps: 80
  sample_batch_size: 4
  sample_shape: null
  fixed_validation_examples: 4
  save_debug_images: true

output:
  model_dir: "./artifacts/checkpoints/stable_diffusion/uncond_runs/diff_scratch_flir_uncond_full"
  log_dir: "./artifacts/runs/main/stable_diffusion/diff_scratch_flir_uncond_full"
  debug_dir: "./artifacts/debug/diff_scratch_flir_uncond_full"
  resume: null

trainer_name: "sd_uncond"
sampler_name: "sd_uncond"
device: null
