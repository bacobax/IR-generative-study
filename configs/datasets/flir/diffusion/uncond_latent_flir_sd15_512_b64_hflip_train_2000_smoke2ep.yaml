# Two-epoch checkpoint smoke run for unconditional latent diffusion.
extends: diff_scratch_flir_uncond_2k.yaml

data:
  batch_size: 8

training:
  epochs: 2
  gradient_accumulation_steps: 1
  save_every_n_epochs: 1
  eval_every: 1

sampling:
  sample_every: 1

output:
  model_dir: "./artifacts/checkpoints/stable_diffusion/smoke_runs/diff_scratch_flir_uncond_2k_smoke2ep"
  log_dir: "./artifacts/runs/test/stable_diffusion/diff_scratch_flir_uncond_2k_smoke2ep"
  debug_dir: "./artifacts/debug/diff_scratch_flir_uncond_2k_smoke2ep"
