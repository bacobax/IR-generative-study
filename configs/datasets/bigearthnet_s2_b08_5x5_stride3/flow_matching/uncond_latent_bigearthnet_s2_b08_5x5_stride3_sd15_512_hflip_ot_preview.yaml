# Lightweight preview run for BigEarthNet Sentinel-2 B08 latent Flow Matching.
# Samples every epoch so integration can be checked from debug preview images.

data:
  dataset_id: "bigearthnet_s2_b08_5x5_stride3"
  image_size: 512
  batch_size: 2
  num_workers: 0
  max_train_samples: 32
  max_val_samples: 8
  subset_strategy: "first_n"
  subset_manifest: null

model:
  unet_config: "configs/models/fm/stable_unet_x4_512.json"
  vae_config: null
  vae_weights: null
  vae_pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_pretrained_subfolder: "vae"
  pretrained_unet_path: null

augment:
  warmup_frac: 0.10
  ramp_frac: 0.30
  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.0
  p_rot_max: 0.0
  p_rot_final: 0.0
  p_hflip_warmup: 0.0
  p_hflip_max: 0.6
  p_hflip_final: 0.3

training:
  epochs: 2
  lr: 0.0001
  t_scale: 1000.0
  train_target: "v"
  save_every_n_epochs: 1
  eval_every: 1
  patience: null
  min_delta: 0.0
  strict_load: true
  max_grad_norm: 1.0

optimizer:
  name: "adamw"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999

scheduler:
  name: "warmup_cosine"
  warmup_ratio: 0.05
  min_lr_ratio: 0.1

ema:
  enabled: true
  decay: 0.999
  start_step: 100

precision:
  mixed_precision: "auto"

path:
  mode: "minibatch_ot"
  solver: "hungarian"

sampling:
  sample_every: 1
  sample_steps: 12
  sample_batch_size: 4
  sample_shape: null
  fixed_validation_examples: 4
  save_debug_images: true

output:
  model_dir: "./artifacts/checkpoints/flow_matching/preview/uncond_latent_bigearthnet_s2_b08_5x5_stride3_sd15_512_hflip_ot"
  log_dir: "./artifacts/runs/preview/flow_matching/uncond_latent_bigearthnet_s2_b08_5x5_stride3_sd15_512_hflip_ot"
  debug_dir: "./artifacts/debug/preview/uncond_latent_bigearthnet_s2_b08_5x5_stride3_sd15_512_hflip_ot"
  resume: null

device: null
