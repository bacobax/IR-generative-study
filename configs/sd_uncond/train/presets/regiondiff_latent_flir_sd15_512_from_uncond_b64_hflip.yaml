# RegionDiff stage-2 latent Stable Diffusion on FLIR, initialized from the
# completed unconditional latent SD SD1.5-VAE run.
# Horizontal flip augmentation follows the matched RegionDiff FM hflip schedule.

data:
  dataset_id: "flir_private_proxy_alignment_v18"
  image_size: 512
  batch_size: 32
  num_workers: 4

model:
  unet_config: "configs/models/fm/stable_unet_x4_512.json"
  vae_config: null
  vae_weights: null
  vae_pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
  vae_pretrained_subfolder: "vae"
  pretrained_unet_path: "./artifacts/checkpoints/stable_diffusion/uncond_runs/uncond_latent_flir_sd15_512_hflip/UNET/unet_sd_uncond_epoch_270.pt"

augment:
  warmup_frac: 0.10
  ramp_frac: 0.30

  p_crop_warmup: 0.0
  p_crop_max: 0.0
  p_crop_final: 0.0
  p_rot_warmup: 0.0
  p_rot_max: 0.0
  p_rot_final: 0.0

  p_hflip_warmup: 0.0
  p_hflip_max: 0.6
  p_hflip_final: 0.3

layout_conditioning:
  enabled: true
  variant: "regiondiff_v1"
  active_region_resolutions: [64, 32, 16]
  layout_token_dim: 256
  bbox_fourier_dim: 64
  same_class_position_slots: 128
  use_background_token: true
  train_mode: "adapters_plus_partial_backbone"
  partial_backbone_modules: [mid_block, up_blocks]
  adapter_learning_rate: 1.0e-4
  backbone_learning_rate: 1.0e-5
  area_loss_enabled: true
  area_loss_alpha: 1.0
  area_loss_background_weight: 0.5
  area_loss_min_weight: 0.5
  area_loss_max_weight: 4.0
  area_x0_loss_weight: 1.0

training:
  epochs: 200
  lr: 1.0e-4
  save_every_n_epochs: 25
  eval_every: 2
  patience: null
  min_delta: 0.0
  strict_load: true
  max_grad_norm: 1.0

optimizer:
  name: "adamw"
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999

scheduler:
  name: "constant_with_warmup"
  warmup_ratio: 0.05
  min_lr_ratio: 1.0

ema:
  enabled: true
  decay: 0.999
  start_step: 100

precision:
  mixed_precision: "auto"

diffusion:
  num_train_timesteps: 1000
  beta_schedule: "scaled_linear"
  beta_start: 0.00085
  beta_end: 0.012
  prediction_type: "epsilon"
  noise_offset: 0.0
  snr_gamma: null

sampling:
  sample_every: 50
  sample_steps: 40
  sample_batch_size: 2
  sample_shape: null
  fixed_validation_examples: 2
  early_sanity_sample_epoch: 3
  save_debug_images: false

output:
  model_dir: "./artifacts/checkpoints/stable_diffusion/uncond_runs/regiondiff_latent_flir_sd15_512_from_uncond_hflip_fixed_x0"
  log_dir: "./artifacts/runs/main/stable_diffusion/regiondiff_latent_flir_sd15_512_from_uncond_hflip_fixed_x0"
  debug_dir: "./artifacts/debug/regiondiff_latent_flir_sd15_512_from_uncond_hflip_fixed_x0"
  resume: null

trainer_name: "sd_uncond"
sampler_name: "sd_uncond"
device: null
