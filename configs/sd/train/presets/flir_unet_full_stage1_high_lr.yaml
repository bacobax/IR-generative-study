# Stage-1 SD IR adaptation baseline B: full U-Net fine-tuning on FLIR proxy.
pretrained_model_name_or_path: runwayml/stable-diffusion-v1-5
baseline_mode: sd_ir_unet
dataset_id: flir_private_proxy_alignment_v18
train_split: train
prompt_text: "thermal image"
resolution: 512
train_batch_size: 16
num_train_epochs: 100
gradient_accumulation_steps: 2
learning_rate: 1e-3
lr_warmup_steps: 0
unet_train_mode: full
freeze_vae: true
freeze_text_encoder: true
validation_prompt: "thermal image"
validation_num_inference_steps: 100
checkpointing_epochs: 1
output_dir: ./artifacts/checkpoints/stable_diffusion/unet_runs/flir_sd15_unet_full_stage1_high_lr
seed: 42
