# SD1.5 LoRA plus RegionDiff layout adapters.

baseline_mode: sd_ir_lora
dataset_id: flir_private_proxy_alignment_v18
train_split: train
resolution: 512
train_batch_size: 2
dataloader_num_workers: 0
max_train_samples: 8
prompt_text: thermal image
rank: 8
lora_alpha_scale: 1.0

layout_conditioning_enabled: true
layout_conditioning_variant: regiondiff_v1
active_region_resolutions: [64, 32, 16]
layout_token_dim: 256
bbox_fourier_dim: 64
same_class_position_slots: 128
use_background_token: true
layout_train_mode: adapters_only
adapter_learning_rate: 1.0e-4
backbone_learning_rate: 1.0e-5

num_train_epochs: 1
max_train_steps: 10
learning_rate: 1.0e-4
lr_scheduler: constant
lr_warmup_steps: 0
checkpointing_epochs: 1
validation_prompt: null
output_dir: ./artifacts/checkpoints/stable_diffusion/lora_runs/flir_sd15_lora_regiondiff_r8_smoke
