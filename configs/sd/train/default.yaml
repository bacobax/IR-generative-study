# Stage-1 Stable Diffusion IR adaptation default configuration.
#
# Source of truth:
#   python -m src.cli.adapt_stable_diffusion --config configs/sd/train/default.yaml

pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
baseline_mode: "sd_ir_lora"
dataset_id: "flir_private_proxy_alignment_v18"
train_split: "train"
subset_manifest: null
prompt_text: "thermal image"

freeze_vae: true
freeze_text_encoder: true

resolution: 512
image_interpolation_mode: "lanczos"
train_batch_size: 4
num_train_epochs: 80
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_scheduler: "constant"
lr_warmup_steps: 0

domainstudio_enabled: false
domainstudio_source_prompt: null
domainstudio_target_prompt: null
domainstudio_lambda_prior: 1.0
domainstudio_lambda_img: 100.0
domainstudio_lambda_hf: 100.0
domainstudio_lambda_hfmse: 0.5
domainstudio_similarity_temperature: 1.0
domainstudio_loss_every_n_steps: 1
domainstudio_min_pairwise_batch: 2
domainstudio_prior_data_dir: null
domainstudio_prior_cache_dir: null
domainstudio_num_prior_images: 200
domainstudio_generate_prior_if_missing: false

rank: 8
lora_alpha_scale: 1.0
lora_target_modules:
  - "to_k"
  - "to_q"
  - "to_v"
  - "to_out.0"
  - "proj_in"
  - "proj_out"

unet_train_mode: "full"
unet_trainable_modules:
  - "mid_block"
  - "up_blocks"

logging_dir: "logs"
report_to: "tensorboard"
validation_num_inference_steps: 30
checkpointing_epochs: 1
save_optimizer_state: true
output_dir: "./artifacts/checkpoints/stable_diffusion/lora_runs/flir_sd15_lora_r8"
seed: 42
