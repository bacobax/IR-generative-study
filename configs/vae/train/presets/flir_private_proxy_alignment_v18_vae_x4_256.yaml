# FLIR proxy VAE x4 at 256x256
train_dir: ./data/raw/flir_private_proxy_alignment_v18/train
val_dir: ./data/raw/flir_private_proxy_alignment_v18/val
image_size: 256
normalization_mode: uint8_linear
batch_size: 16
epochs: 250
model_dir: ./artifacts/checkpoints/vae/vae_runs/flir_private_proxy_alignment_v18_vae_x4_256
log_dir: ./artifacts/runs/main/autoencoder_kl/flir_private_proxy_alignment_v18_vae_x4_256
vae_json: configs/models/fm/vae_config_x4.json
lr: 0.0001
weight_decay: 0.01
beta1: 0.9
beta2: 0.999
scheduler: warmup_cosine
warmup_ratio: 0.05
min_lr_ratio: 0.1
recon_loss: l1_mse
recon_mse_weight: 0.25
kl_start_weight: 0.0
kl_end_weight: 1.0e-05
kl_warmup_ratio: 0.1
max_grad_norm: 1.0
mixed_precision: auto
ema_decay: 0.999
ema_start_step: 100
save_every_n_epochs: 10
patience: 12
min_delta: 0.0
device: cuda:0
