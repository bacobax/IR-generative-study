data:
  dataset_id: flir_private_proxy_alignment_v18
  train_split: train
  val_split: val
  resolution: 512
  batch_size: 32
  num_workers: 4

stage1:
  pretrained_model_name_or_path: runwayml/stable-diffusion-v1-5
  stage1_dir: artifacts/checkpoints/stable_diffusion/lora_runs/flir_sd15_lora_stage1_r8
  stage1_checkpoint: null

prompt:
  prompt_mode: class_list
  constant_prompt: thermal image
  thermal_scene_suffix: in thermal scene.
  use_captions_if_available: false

region:
  active_region_resolutions: [64, 32, 16]
  layout_token_dim: 256
  bbox_fourier_dim: 64
  same_class_position_slots: 128
  use_background_token: true

area_loss:
  enabled: true
  alpha: 0.5
  background_weight: 0.5
  min_weight: 0.5
  max_weight: 4.0

training:
  train_mode: adapters_only
  partial_unet_modules: [mid_block, up_blocks]
  adapter_learning_rate: 1.0e-4
  backbone_learning_rate: 1.0e-5
  num_train_epochs: 80
  gradient_accumulation_steps: 4
  lr_scheduler: constant
  lr_warmup_steps: 500
  checkpointing_steps: 1000
  checkpoints_total_limit: 5
  mixed_precision: fp16
  report_to: tensorboard

validation:
  validation_epochs: 1
  num_validation_images: 4
  validation_num_inference_steps: 30
  guidance_scale: 7.5

output:
  output_dir: artifacts/checkpoints/stable_diffusion/layout_runs/flir_sd15_regiondiff_stage2_from_lora_r8
  logging_dir: logs
